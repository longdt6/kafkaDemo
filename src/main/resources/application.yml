spring:
  application:
    name: kafka-demo
  kafka:
    # One value inherited by producer, consumer, template, and admin.
    # INTERNAL listeners (container service names), only resolvable inside the compose network.
    bootstrap-servers: kafka-1:19092,kafka-2:19093,kafka-3:19094

    # Custom property (not a real Spring Boot key) — matches the course convention.
    topic: messages

    template:
      default-topic: messages   # enables kafkaTemplate.sendDefault(...) in tests

    producer:
      key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all               # leader + all in-sync replicas ack
        retries: 10
        retry.backoff.ms: 1000
        enable.idempotence: true  # safe with acks=all; prevents duplicates after retries

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.IntegerDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: kafka-demo-group
      auto-offset-reset: latest  # fresh group only reads new messages; see docs/04 for earliest

    admin:
      fail-fast: true           # fail startup if Kafka unreachable (healthchecks make this safe)

server:
  port: 8080
